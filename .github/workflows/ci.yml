name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
      SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff

      - name: Lint (ruff)
        run: ruff check app cli.py tests

      - name: Byte-compile
        run: python -m compileall -q app cli.py

      - name: Unit tests (offline)
        run: python -m pytest -q

      - name: App boots and serves the API
        run: |
          python - <<'EOF'
          from fastapi.testclient import TestClient
          from app.main import app
          with TestClient(app) as c:
              r = c.get("/api/health"); assert r.status_code == 200, r.text
              r = c.get("/api/alerts/rule-types"); assert r.status_code == 200 and len(r.json()) > 5
              r = c.get("/api/screener/presets"); assert r.status_code == 200
              r = c.get("/api/market/breadth"); assert r.status_code == 200
              r = c.get("/"); assert r.status_code == 200 and "<title>" in r.text
          print("smoke OK")
          EOF
